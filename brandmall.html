
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>대리점 성과 대시보드 v4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;
  --accent:#3b82f6;--accent2:#06b6d4;--accent3:#8b5cf6;
  --green:#10b981;--yellow:#f59e0b;--red:#ef4444;--pink:#ec4899;--orange:#f97316;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
.header{background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--border);
  padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;
  position:fixed;top:0;left:0;right:0;z-index:300;}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.h-title{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.h-sub{font-size:10px;color:var(--text2);}
.year-bar{background:#0d1322;border-bottom:1px solid var(--border);
  padding:0 24px;height:40px;display:flex;align-items:center;gap:8px;
  position:fixed;top:56px;left:0;right:0;z-index:200;}
.year-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-right:4px;}
.yr-btn{padding:4px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Pretendard';}
.yr-btn:hover{background:var(--surface2);color:var(--text);}
.yr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.yr-btn.cumul.active{background:var(--accent3);border-color:var(--accent3);}
.year-info{margin-left:auto;font-size:10px;color:var(--text3);font-family:'JetBrains Mono';}
.layout{display:flex;height:calc(100vh - 96px);margin-top:96px;}
.sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;}
.global-btn{margin:10px 14px 4px;padding:7px 12px;
  background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(6,182,212,.2));
  border:1px solid rgba(59,130,246,.3);border-radius:7px;cursor:pointer;
  color:var(--accent2);font-size:12px;font-weight:600;text-align:center;transition:all .15s;}
.global-btn:hover,.global-btn.active{background:rgba(59,130,246,.3);border-color:var(--accent);}
.sidebar-label{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:1px;
  text-transform:uppercase;padding:10px 14px 5px;}
.agency-item{padding:7px 14px;cursor:pointer;border-left:3px solid transparent;
  transition:all .15s;display:flex;align-items:center;gap:7px;}
.agency-item:hover{background:var(--surface2);}
.agency-item.active{background:rgba(59,130,246,.12);border-left-color:var(--accent);}
.ag-rank{font-size:9px;font-weight:700;font-family:'JetBrains Mono';color:var(--text3);min-width:18px;}
.ag-name{font-size:11px;font-weight:500;flex:1;line-height:1.3;}
.ag-pct{font-size:10px;font-family:'JetBrains Mono';color:var(--accent2);}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.tab-bar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;gap:2px;overflow-x:auto;flex-shrink:0;position:sticky;top:0;z-index:100;}
.tab-bar::-webkit-scrollbar{height:3px;}
.tab-btn{padding:10px 13px;font-size:11px;font-weight:500;color:var(--text2);
  cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;font-family:'Pretendard';}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent2);font-weight:700;}
.content-area{padding:18px 22px;flex:1;}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 15px;position:relative;overflow:hidden;}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi-card.c1::after{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.kpi-card.c2::after{background:linear-gradient(90deg,var(--green),#34d399);}
.kpi-card.c3::after{background:linear-gradient(90deg,var(--accent3),var(--pink));}
.kpi-card.c4::after{background:linear-gradient(90deg,var(--yellow),var(--orange));}
.kpi-label{font-size:10px;color:var(--text2);font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.kpi-val{font-size:20px;font-weight:800;font-family:'JetBrains Mono';letter-spacing:-1px;}
.kpi-sub{font-size:9px;color:var(--text3);margin-top:2px;}
.kpi-vs{font-size:9px;margin-top:4px;padding:3px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono';}
.kpi-vs.up{background:rgba(16,185,129,.15);color:var(--green);}
.kpi-vs.dn{background:rgba(239,68,68,.15);color:var(--red);}
.kpi-vs.eq{background:rgba(71,85,105,.15);color:var(--text3);}
.yr-badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:4px;
  font-size:9px;font-weight:700;font-family:'JetBrains Mono';}
.yr-badge.cumul{background:rgba(139,92,246,.2);color:var(--accent3);border:1px solid rgba(139,92,246,.3);}
.yr-badge.year{background:rgba(59,130,246,.15);color:var(--accent2);border:1px solid rgba(59,130,246,.3);}
.ag-header{background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--border);border-radius:9px;padding:14px 18px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
.ag-header-name{font-size:18px;font-weight:800;letter-spacing:-.5px;}
.ag-header-meta{font-size:10px;color:var(--text2);margin-top:2px;}
.ag-kpis{display:flex;gap:20px;flex-shrink:0;}
.hkpi{text-align:right;}
.hkpi-label{font-size:9px;color:var(--text2);}
.hkpi-val{font-size:15px;font-weight:700;font-family:'JetBrains Mono';}
.hkpi-avg{font-size:9px;color:var(--text3);margin-top:1px;font-family:'JetBrains Mono';}
.hkpi-diff{font-size:9px;font-family:'JetBrains Mono';font-weight:700;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px;}
.ccard.mb{margin-bottom:12px;}
.ctitle{font-size:11px;font-weight:700;margin-bottom:1px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.cdesc{font-size:10px;color:var(--text2);margin-bottom:10px;}
/* legend strip under cdesc */
.legend-strip{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
/* COL BADGE */
.col-badge{display:inline-flex;align-items:center;background:rgba(6,182,212,.1);
  border:1px solid rgba(6,182,212,.2);border-radius:4px;padding:1px 6px;
  font-size:9px;color:var(--accent2);cursor:help;position:relative;font-family:'JetBrains Mono';}
.col-badge .tip{display:none;position:absolute;top:calc(100% + 5px);left:0;z-index:9999;
  background:#0d1424;border:1px solid var(--border);border-radius:6px;padding:8px 11px;
  width:265px;font-size:10px;line-height:1.8;color:var(--text2);font-family:'Pretendard';
  font-weight:400;white-space:normal;box-shadow:0 8px 28px rgba(0,0,0,.6);pointer-events:none;}
.col-badge:hover .tip{display:block;}
.tip-row{display:flex;gap:6px;align-items:baseline;}
.tip-col{color:var(--accent2);font-family:'JetBrains Mono';font-size:9px;min-width:85px;flex-shrink:0;}
.tip-desc{color:var(--text2);font-size:10px;}
/* COMPARE BARS — 3-line: 이 대리점 / 대리점평균 / 차이 */
.cmp-item{display:grid;grid-template-columns:100px 1fr 58px;gap:7px;align-items:center;margin-bottom:11px;}
.cmp-lbl{font-size:10px;color:var(--text2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-stack{display:flex;flex-direction:column;gap:2px;}
.bar-bg{background:var(--surface2);border-radius:3px;overflow:hidden;}
.bar-h1{height:9px;}
.bar-h2{height:6px;}
.bar-fill{height:100%;border-radius:3px;}
.bar-ag{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.bar-avg{background:linear-gradient(90deg,var(--yellow),var(--orange));opacity:.8;}
.cmp-val{font-size:10px;font-family:'JetBrains Mono';text-align:right;line-height:1.5;}
/* HEATMAP */
.hm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.hm-cell{border-radius:6px;padding:8px 9px;}
.hm-region{font-size:9px;color:rgba(255,255,255,.7);margin-bottom:1px;}
.hm-pct{font-size:14px;font-weight:700;font-family:'JetBrains Mono';color:#fff;}
.hm-avg{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px;}
.hm-diff{font-size:9px;margin-top:1px;font-weight:700;}
/* TABLE */
.tbl-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:12px;}
.tbl-head{padding:11px 15px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
table{width:100%;border-collapse:collapse;}
th{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:7px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface2);}
td{padding:7px 12px;font-size:11px;border-bottom:1px solid rgba(30,45,69,.4);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);cursor:pointer;}
.rk{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:50%;font-size:9px;font-weight:700;font-family:'JetBrains Mono';}
.rk1{background:var(--yellow);color:#000;}.rk2{background:#94a3b8;color:#000;}
.rk3{background:#b45309;color:#fff;}.rko{background:var(--surface2);color:var(--text2);}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;font-family:'JetBrains Mono';}
.tag-blue{background:rgba(59,130,246,.15);color:var(--accent2);}
.tag-green{background:rgba(16,185,129,.15);color:var(--green);}
.tag-yellow{background:rgba(245,158,11,.15);color:var(--yellow);}
.diff-cell{font-family:'JetBrains Mono';font-size:10px;font-weight:700;}
.diff-up{color:var(--green);}.diff-dn{color:var(--red);}.diff-eq{color:var(--text3);}

.insight-box{background:linear-gradient(135deg,rgba(59,130,246,.06),rgba(6,182,212,.04));border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.insight-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px;}
.insight-section{margin-bottom:8px;}
.insight-section:last-child{margin-bottom:0;}
.insight-section-title{font-size:10px;font-weight:700;letter-spacing:.3px;margin-bottom:5px;}
.insight-section-title.strength{color:var(--green);}
.insight-section-title.warning{color:var(--yellow);}
.insight-section-title.neutral{color:var(--accent2);}
.insight-item{font-size:11px;color:var(--text2);line-height:1.7;padding-left:8px;}
.insight-item b{color:var(--text);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

function D(){return ALL_DATA[_curYear];}
function fmt(n){if(!n||isNaN(n))return'0';if(n>=1e8)return(n/1e8).toFixed(1)+'억';if(n>=1e4)return Math.round(n/1e4).toLocaleString()+'만';return n.toLocaleString();}
function fmtW(n){return fmt(n)+'원';}
function findRow(arr,k,v){return arr.find(r=>r[k]===v)||{};}
function yrLabel(){return _curYear==='all'?'누적 전체 (2024~2027)':_curYear+'년 출발';}
function yrBadge(){const cls=_curYear==='all'?'cumul':'year';const txt=_curYear==='all'?'누적 전체':_curYear+'년 출발';return '<span class="yr-badge '+cls+'">'+txt+'</span>';}

// diff arrow helper
function diffHtml(ag, avg, unit){
  const d=(ag-avg);
  if(isNaN(d)||avg===0) return '<span class="diff-eq">—</span>';
  const sign=d>0?'▲':d<0?'▼':'';
  const cls=d>0?'diff-up':d<0?'diff-dn':'diff-eq';
  const val=unit==='pct'?Math.abs(d).toFixed(1)+'%p':fmtW(Math.abs(d));
  return '<span class="'+cls+'">'+sign+' '+val+'</span>';
}

function setYear(yr){
  _curYear=yr;
  document.querySelectorAll('.yr-btn').forEach(b=>b.classList.toggle('active',b.dataset.yr===yr));
  document.getElementById('year-info').textContent=yrLabel();
  if(_view==='global') showGlobal(true); else showAgency(_view,true);
}

function buildSidebar(){
  const el=document.getElementById('agency-list');
  ALL_DATA['all'].agencies.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='agency-item';d.id='ag-'+a['대리점코드'];
    d.innerHTML='<span class="ag-rank">#'+(i+1)+'</span><span class="ag-name">'+a['대리점한글명']+'</span>';
    d.onclick=()=>showAgency(a['대리점코드']);
    el.appendChild(d);
  });
}
function setActive(id){
  document.querySelectorAll('.agency-item,.global-btn').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById(id);if(el)el.classList.add('active');
}

const GT=[
  {label:'요약',fn:renderGlobalSummary},
  {label:'지역 분석',fn:renderGlobalRegion},

  {label:'브랜드/속성',fn:renderGlobalBrand},
  {label:'데포짓/패키지',fn:renderGlobalPackage},
  {label:'대리점 순위',fn:renderGlobalRanking},
];
const AT=[
  {label:'개요',fn:renderAgencySummary},
  {label:'지역 분석',fn:renderAgencyRegion},
  {label:'예약경로',fn:renderAgencyRoute},

  {label:'데포짓',fn:renderAgencyDeposit},

];

function showGlobal(rerender){_view='global';if(!rerender)setActive('global-btn');_curTabs=GT;renderTabs(GT);switchTab(_curTabIdx,GT);}
function showAgency(code,rerender){_view=code;if(!rerender)setActive('ag-'+code);_curTabs=AT;renderTabs(AT);switchTab(_curTabIdx,AT);}
function renderTabs(tabs){
  const tb=document.getElementById('tab-bar');tb.innerHTML='';
  tabs.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(i===_curTabIdx?' active':'');b.textContent=t.label;
    b.onclick=()=>switchTab(i,tabs);tb.appendChild(b);
  });
}
function switchTab(i,tabs){
  _curTabIdx=i;
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  dc();tabs[i].fn(_view==='global'?null:_view);
}

// CHART HELPERS
function mkDonut(id,labels,data,colors){
  const ctx=document.getElementById(id);if(!ctx)return;
  return new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:Array.isArray(colors)?colors:COLORS.slice(0,labels.length),borderWidth:2,borderColor:'#111827',hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10},boxWidth:10,padding:5}}}}});
}
function mkBar(id,labels,data,color,horiz,tipCb){
  const ctx=document.getElementById(id);if(!ctx)return;
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipCb?{callbacks:{label:tipCb}}:{}},scales:{x:{ticks:{color:'#475569',font:{size:9},maxRotation:horiz?0:40},grid:{color:'rgba(30,45,69,.5)'}},y:{ticks:{color:'#475569',font:{size:9}},grid:{color:'rgba(30,45,69,.5)'}}}};
  if(horiz)opts.indexAxis='y';
  return new Chart(ctx,{type:'bar',data:{labels,datasets:[{data,backgroundColor:color,borderRadius:3}]},options:opts});
}
function mkGrouped(id,labels,d1,d2,l1,l2,colors){
  const ctx=document.getElementById(id);if(!ctx)return;
  const c1=colors?colors[0]:'rgba(59,130,246,.85)';
  const c2=colors?colors[1]:'rgba(245,158,11,.75)';
  return new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:l1,data:d1,backgroundColor:c1,borderRadius:3},{label:l2,data:d2,backgroundColor:c2,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10},boxWidth:10}}},scales:{x:{ticks:{color:'#475569',font:{size:9},maxRotation:35},grid:{color:'rgba(30,45,69,.5)'}},y:{ticks:{color:'#475569',font:{size:9},callback:v=>v+'%'},grid:{color:'rgba(30,45,69,.5)'}}}}});
}
function mkLine(id,labels,data,color,tipCb){
  const ctx=document.getElementById(id);if(!ctx)return;
  return new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:color||'#3b82f6',backgroundColor:(color||'#3b82f6').replace('rgb','rgba').replace(')',', .12)'),fill:true,tension:.4,pointRadius:1,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipCb?{callbacks:{label:tipCb}}:{}},scales:{x:{ticks:{color:'#475569',font:{size:9},maxRotation:45},grid:{color:'rgba(30,45,69,.5)'}},y:{ticks:{color:'#475569',font:{size:9},callback:v=>fmt(v)},grid:{color:'rgba(30,45,69,.5)'}}}}});
}

// compare bars: 이 대리점(파랑) vs 대리점평균(노랑)
function cmpBars(keys, agMap, avgMap){
  return keys.map(k=>{
    const ag=agMap[k]||0, avg=avgMap[k]||0;
    const diff=(ag-avg).toFixed(1);
    const dc=diff>0?'var(--green)':diff<0?'var(--red)':'var(--text3)';
    const arrow=diff>0?'▲':diff<0?'▼':'—';
    return '<div class="cmp-item">'+
      '<div class="cmp-lbl">'+k+'</div>'+
      '<div class="bar-stack">'+
        '<div class="bar-bg bar-h1"><div class="bar-fill bar-ag" style="width:'+ag+'%"></div></div>'+
        '<div class="bar-bg bar-h2"><div class="bar-fill bar-avg" style="width:'+avg+'%"></div></div>'+
      '</div>'+
      '<div class="cmp-val">'+
        '<span style="color:var(--accent2)">'+ag+'%</span><br>'+
        '<span style="color:var(--yellow);font-size:9px">avg '+avg+'%</span><br>'+
        '<span style="color:'+dc+';font-size:9px">'+arrow+' '+(diff>0?'+':'')+diff+'p</span>'+
      '</div>'+
    '</div>';
  }).join('');
}

function agHeader(code){
  const d=D();
  const a=d.agencies.find(x=>x['대리점코드']===code)||{};
  const s=d.summary;
  const rank=d.agencies.findIndex(x=>x['대리점코드']===code)+1;
  // vs avg
  function vsAvg(val, avg){
    const diff=val-avg, pct=avg>0?((diff/avg)*100).toFixed(1):0;
    const cls=diff>0?'diff-up':diff<0?'diff-dn':'diff-eq';
    const arrow=diff>0?'▲':diff<0?'▼':'—';
    return '<span class="'+cls+'">'+arrow+' '+(diff>0?'+':'')+pct+'%</span>';
  }
  return '<div class="ag-header">'+
    '<div>'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">'+
        '<div class="ag-header-name">'+a['대리점한글명']+'</div>'+
        '<span class="tag tag-yellow">#'+rank+'위</span>'+yrBadge()+
      '</div>'+
      '<div class="ag-header-meta">코드: '+a['대리점코드']+' · '+yrLabel()+'</div>'+
    '</div>'+
    '<div class="ag-kpis">'+
      '<div class="hkpi">'+
        '<div class="hkpi-label">판매금액</div>'+
        '<div class="hkpi-val" style="color:var(--accent2)">'+fmtW(a['판매금액'])+'</div>'+
        '<div class="hkpi-avg">대리점 평균 '+fmtW(s.avg_sales)+'</div>'+
        '<div class="hkpi-diff">'+vsAvg(a['판매금액'],s.avg_sales)+'</div>'+
      '</div>'+
      '<div class="hkpi">'+
        '<div class="hkpi-label">순예약인원</div>'+
        '<div class="hkpi-val" style="color:var(--green)">'+a['순예약인원'].toLocaleString()+'명</div>'+
        '<div class="hkpi-avg">대리점 평균 '+s.avg_pax.toLocaleString()+'명</div>'+
        '<div class="hkpi-diff">'+vsAvg(a['순예약인원'],s.avg_pax)+'</div>'+
      '</div>'+
      '<div class="hkpi">'+
        '<div class="hkpi-label">평균단가</div>'+
        '<div class="hkpi-val" style="color:var(--yellow)">'+fmtW(a['평균단가'])+'</div>'+
        '<div class="hkpi-avg">대리점 평균 '+fmtW(s.avg_단가)+'</div>'+
        '<div class="hkpi-diff">'+vsAvg(a['평균단가'],s.avg_단가)+'</div>'+
      '</div>'+
      '<div class="hkpi">'+
        '<div class="hkpi-label">예약건수</div>'+
        '<div class="hkpi-val" style="color:var(--pink)">'+a['건수'].toLocaleString()+'건</div>'+
        '<div class="hkpi-avg">대리점 평균 '+s.avg_건수.toLocaleString()+'건</div>'+
        '<div class="hkpi-diff">'+vsAvg(a['건수'],s.avg_건수)+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function renderGlobalRanking(){

function generateInsight(code){
  const d=D();
  const a=d.agencies.find(x=>x['대리점코드']===code);
  if(!a) return '';
  const name=a['대리점한글명'];
  const s=d.summary;
  const strengths=[],warnings=[],neutrals=[];
  const rank=d.agencies.findIndex(x=>x['대리점코드']===code)+1;
  const total=d.agencies.length;

  // 데이터 없는 경우 (2027년 등)
  if(a['판매금액']===0){
    return '<div class="insight-box"><div class="insight-title">💡 인사이트 <span style="font-size:10px;color:var(--text3);font-weight:400">· '+yrLabel()+' 기준</span></div><div class="insight-section"><div class="insight-section-title neutral">📌 참고</div><div class="insight-item">• '+yrLabel()+' 기간에 해당 대리점의 판매 데이터가 없어요 (0건)</div></div></div>';
  }

  // 1. 판매실적
  const salesRatio=((a['판매금액']-s.avg_sales)/s.avg_sales*100).toFixed(0);
  if(rank<=5) strengths.push('판매금액 전체 <b>'+rank+'위</b> — 대리점 평균 대비 <b>+'+(Math.abs(salesRatio))+'%</b> 초과 달성');
  else if(rank<=Math.floor(total/3)) neutrals.push('판매금액 전체 <b>'+rank+'위</b> — 상위 '+Math.round(rank/total*100)+'% 수준');
  else if(rank>Math.floor(total*2/3)) warnings.push('판매금액 전체 <b>'+rank+'위 ('+total+'개 중)</b> — 대리점 평균 대비 <b>'+salesRatio+'%</b>, 실적 개선 필요');
  else neutrals.push('판매금액 전체 <b>'+rank+'위</b> — 대리점 평균 대비 '+(salesRatio>=0?'+':'')+salesRatio+'%');

  // 2. 평균단가
  if(s.avg_단가>0){
    const dankaRatio=((a['평균단가']-s.avg_단가)/s.avg_단가*100).toFixed(0);
    if(dankaRatio>=30) strengths.push('평균단가 <b>'+Math.round(a['평균단가']/10000).toLocaleString()+'만원</b> — 평균 대비 <b>+'+dankaRatio+'%</b> 고단가 상품 강세');
    else if(dankaRatio<=-20) warnings.push('평균단가 <b>'+Math.round(a['평균단가']/10000).toLocaleString()+'만원</b> — 평균('+Math.round(s.avg_단가/10000)+'만원) 대비 <b>'+dankaRatio+'%</b> 낮음, 고단가 상품 확대 여지');
    else neutrals.push('평균단가 <b>'+Math.round(a['평균단가']/10000).toLocaleString()+'만원</b> — 대리점 평균과 유사한 수준');
  }

  // 3. 지역
  const rgn=d.rgn_pct.find(r=>r['대리점한글명']===name)||{};
  const rgnAvg=d.rgn_avg;
  const regions=['동남아','일본','유럽','중국','미주','괌/사이판','호주/뉴질랜드'];
  let topStr=null,topWeak=null,maxD=0,minD=0;
  regions.forEach(r=>{
    const ag=rgn[r]||0,avg=rgnAvg[r]||0,diff=ag-avg;
    if(diff>maxD){maxD=diff;topStr={r,ag,avg,diff};}
    if(diff<minD){minD=diff;topWeak={r,ag,avg,diff};}
  });
  if(topStr&&topStr.diff>=5) strengths.push('<b>'+topStr.r+'</b> 판매비중 <b>'+topStr.ag+'%</b> — 평균('+topStr.avg+'%) 대비 <b>+'+topStr.diff.toFixed(1)+'%p</b> 강세');
  if(topWeak&&topWeak.diff<=-5) warnings.push('<b>'+topWeak.r+'</b> 판매비중 <b>'+topWeak.ag+'%</b> — 평균('+topWeak.avg+'%) 대비 <b>'+topWeak.diff.toFixed(1)+'%p</b> 약세, 성장 여지 있음');

  // 4. 예약경로
  const rl=d.rl_pct.find(r=>r['대리점한글명']===name)||{};
  const rlAvg=d.rl_avg;
  const dirAg=rl['대리점']||0,dirAvg=rlAvg['대리점']||0;
  const onAg=rl['범용/상용닷컴']||0,onAvg=rlAvg['범용/상용닷컴']||0;
  if(dirAg-dirAvg>=10) strengths.push('대리점 직접 예약 <b>'+dirAg+'%</b> — 평균('+dirAvg+'%) 대비 높아 <b>충성 고객 기반 탄탄</b>');
  else if(dirAg-dirAvg<=-15) warnings.push('대리점 직접 예약 <b>'+dirAg+'%</b> — 평균('+dirAvg+'%) 대비 낮음, <b>자체 고객 유입 강화 필요</b>');
  if(onAg-onAvg>=15) strengths.push('온라인(범용닷컴) 예약 <b>'+onAg+'%</b> — 평균('+onAvg+'%) 대비 높아 <b>디지털 채널 활용 우수</b>');

  // 5. 브랜드
  const brand=d.brand_pct.find(r=>r['대리점한글명']===name)||{};
  const bAvg=d.brand_avg;
  const prAg=brand['프리미엄']||0,prAvg=bAvg['프리미엄']||0;
  const svAg=brand['세이브']||0,svAvg=bAvg['세이브']||0;
  if(prAg-prAvg>=3) strengths.push('프리미엄 상품 비중 <b>'+prAg+'%</b> — 평균('+prAvg+'%) 대비 높아 <b>고급 상품 판매 역량 우수</b>');
  if(svAg-svAvg>=15) neutrals.push('세이브(보급형) 비중 <b>'+svAg+'%</b> — 평균('+svAvg+'%) 대비 높음, 중저가 상품 중심 포트폴리오');

  // 6. 데포짓
  const depo=d.depo_pct.find(r=>r['대리점한글명']===name)||{};
  const dAvg=d.depo_avg;
  const fdAg=depo['전체DEPO']||0,fdAvg=dAvg['전체DEPO']||0;
  if(fdAg-fdAvg>=5) strengths.push('전체DEPO 비중 <b>'+fdAg+'%</b> — 평균('+fdAvg+'%) 대비 높아 <b>조기 예약 고객 확보 우수</b>');
  else if(fdAg-fdAvg<=-5) warnings.push('전체DEPO 비중 <b>'+fdAg+'%</b> — 평균('+fdAvg+'%) 대비 낮음, <b>조기 예약 유도 전략 필요</b>');

  // 7. 건당 인원
  if(a['건수']>0&&s.avg_건수>0){
    const paxPer=(a['순예약인원']/a['건수']).toFixed(1);
    const avgPer=(s.avg_pax/s.avg_건수).toFixed(1);
    if(paxPer-avgPer>=1) strengths.push('건당 평균 인원 <b>'+paxPer+'명</b> — 평균('+avgPer+'명) 대비 높아 <b>단체/그룹 예약 강세</b>');
    else if(avgPer-paxPer>=1) neutrals.push('건당 평균 인원 <b>'+paxPer+'명</b> — 개인/소규모 예약 중심 패턴');
  }

  if(strengths.length===0&&warnings.length===0) neutrals.push('전반적으로 대리점 평균과 유사한 패턴을 보이고 있어요');

  let html='<div class="insight-box">';
  html+='<div class="insight-title">💡 인사이트 <span style="font-size:10px;color:var(--text3);font-weight:400">· '+yrLabel()+' 기준 · 대리점 평균과 비교</span></div>';
  if(strengths.length>0){html+='<div class="insight-section"><div class="insight-section-title strength">✅ 강점</div>';strengths.forEach(x=>{html+='<div class="insight-item">• '+x+'</div>';});html+='</div>';}
  if(warnings.length>0){html+='<div class="insight-section"><div class="insight-section-title warning">⚠️ 개선 포인트</div>';warnings.forEach(x=>{html+='<div class="insight-item">• '+x+'</div>';});html+='</div>';}
  if(neutrals.length>0){html+='<div class="insight-section"><div class="insight-section-title neutral">📌 참고</div>';neutrals.forEach(x=>{html+='<div class="insight-item">• '+x+'</div>';});html+='</div>';}
  html+='</div>';
  return html;
}
